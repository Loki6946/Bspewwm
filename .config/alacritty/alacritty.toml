import = [
  "~/.config/alacritty/sage.toml"
]

shell = "/usr/bin/zsh"

[window]

opacity = 1.0

padding.x = 15
padding.y = 15

decorations = "Full"
decorations_theme_variant = "Dark" # "Dark"

[font]
normal = { family = "RobotoMonoNerdFont", style = "SemiBold" }
bold = { family = "RobotoMonoNerdFont", style = "Bold" }
italic = { family = "RobotoMonoNerdFont", style = "Italic" }
bold_italic = { family = "RobotoMonoNerdFont", style = "Bold Italic" }

size = 12.0

offset.x = 0
offset.y = 0

[cursor]
style = { shape = "Block", blinking = "On"}
vi_mode_style = { shape = "Block", blinking = "On" }
