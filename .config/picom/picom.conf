# Window animation
{
    match = "window_type = 'normal'";
    animations = (
      {
        triggers = ["open"];
        opacity = {
          curve = "cubic-bezier(0.39, 1.29, 0.35, 0.98)";
          duration = 0.3;
          start = 0;
          end = "window-raw-opacity";
        };
        scale-x = {
          curve = "cubic-bezier(0.42, 1.67, 0.21, 0.90)";
          duration = 0.35;
          start = 0.92;
          end = 1.0;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
      },
      {
        triggers = ["close"];
        opacity = {
          curve = "cubic-bezier(0.3, 0.0, 0.8, 0.15)";
          duration = 0.2;
          start = "window-raw-opacity-before";
          end = 0;
        };
        scale-x = {
          curve = "cubic-bezier(0.3, 0.0, 0.8, 0.15)";
          duration = 0.2;
          start = 1.0;
          end = 0.92;
        };
        scale-y = "scale-x";
        offset-x = "(1 - scale-x) / 2 * window-width";
        offset-y = "(1 - scale-y) / 2 * window-height";
      },
      {
        triggers = ["geometry"];
        scale-x = {
          curve = "cubic-bezier(0.05, 0.7, 0.1, 1.0)";
          duration = 0.3;
          start = "window-width-before / window-width";
          end = 1.0;
        };
        scale-y = {
          curve = "cubic-bezier(0.05, 0.7, 0.1, 1.0)";
          duration = 0.3;
          start = "window-height-before / window-height";
          end = 1.0;
        };
        offset-x = {
          curve = "cubic-bezier(0.05, 0.7, 0.1, 1.0)";
          duration = 0.3;
          start = "window-x-before - window-x";
          end = 0;
        };
        offset-y = {
          curve = "cubic-bezier(0.05, 0.7, 0.1, 1.0)";
          duration = 0.3;
          start = "window-y-before - window-y";
          end = 0;
        };
      },
    );
  },

